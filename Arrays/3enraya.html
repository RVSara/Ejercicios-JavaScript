<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>3 en Raya</title>
</head>

<script>
  const tresEnRaya = () => {
    let board = ["_", "_", "_", "_", "_", "_", "_", "_", "_"]
    const printBoard = () => {
      alert(board[0] + "|" + board[1] + "|" + board[2] + "\n" + board[3] + "|" + board[4] + "|" + board[5] + "\n" + board[6] + "|" + board[7] + "|" + board[8]);
    }
    printBoard();

    let haGanadoAlguien = false;
    const evaluateWin = () => {
      let row1 = [board[0], board[1], board[2]];
      let row2 = [board[3], board[4], board[5]];
      let row3 = [board[6], board[7], board[8]];
      let column1 = [board[0], board[3], board[6]];
      let column2 = [board[1], board[4], board[7]];
      let column3 = [board[2], board[5], board[8]];
      let diagonal1 = [board[0], board[4], board[8]];
      let diagonal2 = [board[2], board[4], board[6]];

      let player1 = (n) => n === "X";
      let player2 = (n) => n === "O";

      if(
        row1.every(player1) ||
        row2.every(player1) ||
        row3.every(player1) ||
        column1.every(player1) ||
        column2.every(player1) ||
        column3.every(player1) ||
        diagonal1.every(player1) ||
        diagonal2.every(player1)
      ){
        haGanadoAlguien = true;
        printBoard();
        return alert("¡Ha ganado el jugador 1!");
      } else if (
        row1.every(player2) ||
        row2.every(player2) ||
        row3.every(player2) ||
        column1.every(player2) ||
        column2.every(player2) ||
        column3.every(player2) ||
        diagonal1.every(player2) ||
        diagonal2.every(player2)
      ) {
        haGanadoAlguien = true;
        printBoard();
        return alert("¡Ha ganado el jugador 2!");
      } else printBoard();
    }

    let jugador = true;
    while(haGanadoAlguien === false){
      const juego = () => {
        if(jugador){
          let casilla1 = Number(prompt("Jugador 1: Introduce un número del 1 al 9:") - 1);
          while (board[casilla1] == "O" || board[casilla1] == "X") {
            casilla1 = Number(prompt("¡Esa casilla ya está ocupada! Elige otro número:") - 1);
          }
          board[casilla1] = "X";
        } else {
          let casilla2 = Number(prompt("Jugador 2: Introduce un número del 1 al 9:") - 1);
          while (board[casilla2] == "O" || board[casilla2] == "X") {
            casilla2 = Number(prompt("¡Esa casilla ya está ocupada! Elige otro número:") - 1);
          }
          board[casilla2] = "O";
        }
      }
      juego();
      evaluateWin(); 
      jugador = !jugador;
    }
  }

  tresEnRaya();


</script>
</html>
