<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Elige una puerta</title>
</head>

<script>
  let puerta = Number(prompt("Entras en una mazmorra con dos puertas: La puerta 1 y la puerta 2. Tras una de las dos puertas, se encuentra una muerte segura. ¿Qué puerta escoges - 1 o 2?"));

  const desenlace = () => {
    let num = Math.floor((Math.random() * 2) + 1);
    let i = 0;
    while (typeof puerta == "number") {
      if (puerta == num) {
        return alert("¿A quién se le ocurre elegir la puerta de los pinchos? A lo mejor debería intentarlo otro héroe...");
      } else {
        while (num !== puerta) {
          num = Math.floor((Math.random() * 2) + 1);
          if (puerta == 1 || puerta == 2) {
            i++;
            puerta = Number(prompt(`Al abrir la ${i}a puerta, te encuentras en otra estancia con dos posibles caminos. Una puerta está rodeada de pinchos ensangrentados, pero la otra parece segura. ¿Qué puerta escoges - 1 o 2?`));
          } else puerta = Number(prompt("¡Eso no es una puerta, tontaina!"));
        }
      };
    }
  }

  desenlace();
</script>
</html>
