<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Número secreto</title>
</head>

<script>
  const num = Math.floor(Math.random() * 10) + 1;
  alert(`¡Presta atención! Tu número de la suerte de hoy es el ${num}.`);
  const suerte = prompt("¿Cuál es el número de la suerte de hoy?");

  let respuesta = () => {
    if(suerte == num){
      return "¡Felicidades! Habla con el profesor para recibir tu premio."
    } else return "¡Te has equivocado! Actualiza e inténtalo de nuevo."
  }

  alert(respuesta())
</script>

</html>
