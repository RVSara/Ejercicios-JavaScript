<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Identifícate</title>
</head>

<script>
  const mensaje = "Introduce tu nombre, por favor:";
  const nombre = prompt(mensaje);
  const restart = () => {
    const fallo = "Tu respuesta es inválida. Reinicia el proceso.";
    alert(fallo);
    prompt(mensaje);
  }
  const formulario = () => {
    switch(nombre){
      case nombre.includes("[1,2,3,4,5,6,7,8,9,0]"):
        restart();
        break;
      case typeof nombre == "string":
        const registro = prompt(`¿Tu nombre es ${nombre}?\nYes/No`);
        if(registro == "Yes"){
          return "¡Felicidades! Tu nombre ha sido registrado correctamente.";
        } else restart();
        break;
      default:
        restart();
    }
  }
  
  formulario(nombre);
</script>
</html>
