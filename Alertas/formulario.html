<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Identifícate</title>
</head>

<script>
  const mensaje = "Introduce tu nombre, por favor:";
    let nombre = prompt(mensaje);
    const restart = () => {
      const fallo = "Tu respuesta es inválida. Reinicia el proceso.";
      alert(fallo);
      nombre = prompt(mensaje);
      formulario(nombre);
    };

    const formulario = () => {
      if (/\d/.test(nombre)) {
        restart();
      } else {
        const registro = prompt(`¿Tu nombre es ${nombre}?\nYes/No`);
        if (registro == "Yes") {
        return alert(
          "¡Felicidades! Tu nombre ha sido registrado correctamente."
        );
      } else restart();
      }
    };
  
  formulario(nombre);
</script>
</html>
