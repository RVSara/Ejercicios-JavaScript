<!DOCTYPE html>
<html>

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Número secreto</title>
</head>

<body>
  <p>Esta web tiene un número secreto del 0 al 5. ¿Puedes adivinarlo?</p>
  <input type="number" />
  <button onclick="adivina()">Prueba</button>
  <output></output>
</body>

<script>
  const adivina = () => {
    const secreto = Math.floor(Math.random() * (5+1));
    const usuario = document.querySelector("input").value;
    console.log(secreto);
    if(usuario == secreto){
      document.querySelector("output").value = "¡Has acertado!";
    } else document.querySelector("output").value = "¡Mala suerte!";
  }
</script>
</html>
