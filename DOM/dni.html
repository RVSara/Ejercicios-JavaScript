<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>DNI</title>
</head>

<body>
  <input type="text" id="dni" />
  <button onClick="getDNILetter()">Detectar letra</button>
  <p id="result"></p>
</body>

<script>
  const getDNILetter = (number) => {
    let dni = Number(document.querySelector("#dni").value);
    const letra = "TRWAGMYFPDXBNJZSQVHLCKE";
    const count = dni % 23; // No es aleatorio!
    number = dni;
    let result;
    if (String(number).length == 8 && typeof number == "number") {
      result = "DNI detectado por el sistema: " + dni + letra[count];
    } else {
      result = "Tu DNI no es válido. Actualiza e inténtalo de nuevo.";
    }
    /* Si queremos modificar el innerHTML para mostrar el resultado, no utilizamos return, ya que eso resuelve la función prematuramente */
    document.querySelector("#result").innerHTML = result;
  };
</script>
</html>
